<style>
:root{
  --bg:#f3f4f8;
  --bg-blur:rgba(243,244,248,.86);
  --card:#ffffff;
  --text:#12141a;
  --muted:#6b7280;
  --faint:#9ca3af;
  --line:#e5e7ef;
  --accent:#4f46e5;
  --accent-soft:#eef0ff;
  --chip:#f1f2f7;
  --online-bg:#dbeafe;
  --online-fg:#1d4ed8;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 6px 16px -8px rgba(16,24,40,.16);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0f14;
    --bg-blur:rgba(13,15,20,.86);
    --card:#171a22;
    --text:#eef0f6;
    --muted:#98a0b0;
    --faint:#6b7280;
    --line:#242835;
    --accent:#818cf8;
    --accent-soft:#1c2033;
    --chip:#1f2331;
    --online-bg:#1b2a52;
    --online-fg:#93c5fd;
    --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -12px rgba(0,0,0,.7);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg);color:var(--text);
  min-height:100vh;
  padding-bottom:calc(74px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:contain;
}

/* ---------- ВЕРХНЯЯ ПАНЕЛЬ ---------- */
.appbar{
  position:sticky;top:0;z-index:20;
  background:var(--bg-blur);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-bottom:1px solid var(--line);
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
}
.ab-inner{
  max-width:720px;margin:0 auto;
  display:flex;align-items:center;gap:10px;
}
.ab-logo{
  width:36px;height:36px;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(135deg,#6366f1,#8b5cf6);
  color:#fff;font-size:12px;font-weight:800;letter-spacing:.02em;
  display:flex;align-items:center;justify-content:center;
}
.ab-titles{min-width:0}
.ab-title{font-size:16px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ab-sub{font-size:11.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ab-wish{
  margin-left:auto;flex:0 1 auto;
  font-size:11.5px;line-height:1.3;font-weight:600;
  color:var(--accent);
  text-align:right;max-width:130px;
  background:var(--accent-soft);
  padding:6px 10px;border-radius:11px;
  animation:fadeIn .5s ease both;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* ---------- КОНТЕНТ ---------- */
main{max-width:720px;margin:0 auto;padding:16px 14px 8px;display:block}

.page-head{margin:2px 2px 16px}
.ph-day{font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.ph-date{font-size:13.5px;color:var(--muted);margin-top:3px}
.week-pill{
  display:inline-block;margin-top:9px;
  background:var(--accent-soft);color:var(--accent);
  font-size:11.5px;font-weight:700;letter-spacing:.02em;
  padding:4px 10px;border-radius:999px;
}

/* ---------- КАРТОЧКА ЗАНЯТИЯ ---------- */
.list{display:flex;flex-direction:column;gap:9px}
.lesson{
  position:relative;display:flex;gap:12px;
  background:var(--card);border-radius:15px;
  padding:12px 13px 12px 17px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.lesson::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,#6366f1);
}
.lesson.past{opacity:.42;filter:saturate(.55)}
.lesson.now{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.lesson.now::after{
  content:"";position:absolute;right:12px;top:12px;
  width:7px;height:7px;border-radius:50%;background:var(--accent);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.8)}}

.ltime{display:flex;flex-direction:column;min-width:50px;flex:0 0 auto;padding-top:1px}
.ltime b{font-size:14.5px;font-weight:750;letter-spacing:-.02em;line-height:1.2}
.ltime span{font-size:11px;color:var(--faint);margin-top:2px}

.lbody{flex:1;min-width:0}
.lbody h3{
  margin:0 0 3px;font-size:15px;font-weight:650;
  line-height:1.25;letter-spacing:-.01em;
}
.ltype{font-size:12px;color:var(--muted);margin-bottom:7px;line-height:1.3}
.lmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:12.5px}
.lteacher{opacity:.88}
.lroom{
  display:inline-flex;align-items:center;gap:3px;
  background:var(--chip);color:var(--muted);
  padding:2.5px 8px;border-radius:8px;
  font-size:11.5px;font-weight:700;letter-spacing:.01em;
  text-decoration:none;
}
.lroom svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lroom.online{
  background:var(--online-bg);color:var(--online-fg);
  transition:transform .12s,filter .15s;
}
a.lroom.online{cursor:pointer}
a.lroom.online:active{transform:scale(.94);filter:brightness(.95)}
a.lroom.online::after{
  content:"";width:9px;height:9px;margin-left:1px;
  background:currentColor;
  -webkit-mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M14 4h6v6M20 4l-9 9M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6'/></svg>") center/contain no-repeat;
          mask:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='none' stroke='black' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round' d='M14 4h6v6M20 4l-9 9M19 13v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h6'/></svg>") center/contain no-repeat;
  opacity:.75;
}

/* ---------- ПУСТОЕ СОСТОЯНИЕ ---------- */
.empty{
  background:var(--card);border-radius:16px;padding:32px 22px;
  text-align:center;box-shadow:var(--shadow);
}
.empty svg{width:44px;height:44px;stroke:var(--faint);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px}
.empty .et{font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.25}
.empty .es{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45}
.next-box{
  margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);
  font-size:12.5px;color:var(--muted);text-align:left;
}
.next-box b{display:block;color:var(--text);font-size:13.5px;font-weight:650;margin-top:3px}

/* ---------- НАВИГАЦИЯ НЕДЕЛИ/МЕСЯЦА ---------- */
.nav-row{display:flex;align-items:center;gap:10px;margin:0 0 16px}
.nav-btn{
  width:38px;height:38px;flex:0 0 auto;border-radius:12px;
  border:1px solid var(--line);background:var(--card);color:var(--text);
  font-size:19px;line-height:1;font-weight:600;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  transition:transform .12s,background .15s,opacity .15s;
}
.nav-btn:active{transform:scale(.92);background:var(--chip)}
.nav-btn:disabled{opacity:.3;cursor:default}
.nav-btn:disabled:active{transform:none;background:var(--card)}
.nav-title{flex:1;text-align:center;min-width:0}
.nt-main{font-size:15px;font-weight:700;letter-spacing:-.02em}
.nt-sub{font-size:11.5px;color:var(--muted);margin-top:2px}

/* ---------- НЕДЕЛЯ ---------- */
.dayblock{margin-bottom:15px}
.dayblock-head{display:flex;align-items:baseline;gap:8px;margin:0 3px 8px}
.dh-name{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.dh-date{font-size:11.5px;color:var(--faint)}
.dayblock.is-today .dh-name{color:var(--accent)}
.dayblock.is-today .dh-date{color:var(--accent);opacity:.7}
.no-lessons{font-size:12.5px;color:var(--faint);padding:2px 3px 0;font-style:italic}

/* ---------- МЕСЯЦ ---------- */
.cal{
  background:var(--card);border-radius:16px;padding:12px 10px 10px;
  box-shadow:var(--shadow);margin-bottom:16px;
}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px}
.cal-head span{
  text-align:center;font-size:11px;font-weight:800;
  color:var(--faint);text-transform:uppercase;letter-spacing:.04em;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mcell{
  position:relative;border:0;background:transparent;cursor:pointer;
  height:48px;border-radius:11px;padding:5px 0 0;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  font:inherit;color:var(--text);transition:background .15s,transform .12s;
}
.mcell:active{transform:scale(.93)}
.mcell .mnum{font-size:13.5px;font-weight:600;line-height:1}
.mcell.out{opacity:.28}
.mcell.disabled{opacity:.28;cursor:default}
.mcell.disabled:active{transform:none}
.mcell.today{background:var(--accent-soft)}
.mcell.today .mnum{color:var(--accent);font-weight:800}
.mcell.sel{background:var(--accent);color:#fff}
.mcell.sel .mnum{color:#fff;font-weight:800}
.mcell.sel .dots i{background:#fff!important}
.mcell.past .mnum{color:var(--faint)}
.dots{display:flex;gap:2.5px;height:5px;align-items:center}
.dots i{width:5px;height:5px;border-radius:50%;display:block;background:var(--accent)}

.sel-title{
  font-size:12px;font-weight:800;text-transform:uppercase;
  letter-spacing:.07em;color:var(--muted);margin:0 3px 9px;
}

/* ---------- ТАББАР ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  display:flex;gap:4px;
  padding:7px 10px calc(7px + env(safe-area-inset-bottom));
  background:var(--bg-blur);
  -webkit-backdrop-filter:saturate(180%) blur(16px);
  backdrop-filter:saturate(180%) blur(16px);
  border-top:1px solid var(--line);
}
.tabbar-inner{max-width:720px;margin:0 auto;display:flex;gap:4px;width:100%}
.tabbar button{
  flex:1;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:10.5px;font-weight:700;letter-spacing:.01em;
  padding:7px 2px;border-radius:13px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:background .18s,color .18s;
}
.tabbar button.active{color:var(--accent);background:var(--accent-soft)}
.tabbar svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
</style>

  { d:6, s:'16:20', e:'17:50', subj:'Интеллектуальные цифровые технологии',
    type:'Занятие семинарского типа', teacher:'Карелина Е.Б.', room:'1412',
    dates:['2026-12-26'] }
];

/* =========================================================
   ДАТЫ И НЕДЕЛИ
   ========================================================= */
const MON_GEN = ['января','февраля','марта','апреля','мая','июня',
                 'июля','августа','сентября','октября','ноября','декабря'];
const MON_NOM = ['Январь','Февраль','Март','Апрель','Май','Июнь',
                 'Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const DAY_FULL  = ['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'];
const DAY_SHORT = ['Вс','Пн','Вт','Ср','Чт','Пт','Сб'];

const BASE_MONDAY = new Date(2026, 9, 12); // неделя с 13 октября 2026 = 1-я

function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function addDays(d,n){ const x = new Date(d); x.setDate(x.getDate()+n); return x; }
function mondayOf(d){
  const x = startOfDay(d);
  const wd = (x.getDay() + 6) % 7;
  x.setDate(x.getDate() - wd);
  return x;
}
function ymd(d){
  return d.getFullYear() + '-' +
         String(d.getMonth()+1).padStart(2,'0') + '-' +
         String(d.getDate()).padStart(2,'0');
}
function weekNumber(d){
  const diff = Math.round((mondayOf(d) - BASE_MONDAY) / 604800000);
  return (((diff % 2) + 2) % 2) === 0 ? 1 : 2;
}
function toMin(t){ const p = t.split(':'); return (+p[0])*60 + (+p[1]); }
function nowMin(){ const n = new Date(); return n.getHours()*60 + n.getMinutes(); }
function isOnline(room){ return /[A-Za-zА-Яа-я]/.test(room); }

/* Границы семестра */
function isBeforeSem(d){ return startOfDay(d) < SEM_START; }
function isAfterSem(d){ return startOfDay(d) > SEM_END; }
function isInSem(d){ return !isBeforeSem(d) && !isAfterSem(d); }

/* =========================================================
   ЛОГИКА РАСПИСАНИЯ
   ========================================================= */
function lessonsFor(date){
  if (!isInSem(date)) return [];
  const k = ymd(date);
  const w = weekNumber(date);
  return LESSONS.filter(l => {
    if (l.d !== date.getDay()) return false;
    if (l.dates) return l.dates.indexOf(k) !== -1;
    if (l.repeat === 'weekly') return true;
    if (l.repeat === 'odd')  return w === 1;
    if (l.repeat === 'even') return w === 2;
    return false;
  }).sort((a,b) => a.s.localeCompare(b.s));
}

/* Прошла ли пара (с учётом всей прошедшей недели и сегодняшнего времени) */
function lessonState(l, date){
  const now   = new Date();
  const today = startOfDay(now);
  const d     = startOfDay(date);

  if (d < today) return 'past';
  if (d > today) return '';

  const nm = nowMin(), s = toMin(l.s), e = toMin(l.e);
  if (nm >= e) return 'past';
  if (nm >= s && nm < e) return 'now';
  return '';
}

function nextLesson(){
  const today = startOfDay(new Date());
  if (isAfterSem(today)) return null;
  const startSearch = isBeforeSem(today) ? SEM_START : today;

  for (let i = 0; i < 200; i++){
    const d = addDays(startSearch, i);
    if (isAfterSem(d)) return null;
    const ls = lessonsFor(d);
    if (!ls.length) continue;

    if (ymd(d) === ymd(today)){
      const nm = nowMin();
      const fut = ls.find(l => toMin(l.e) > nm);
      if (fut) return { d: d, l: fut };
      continue;
    }
    return { d: d, l: ls[0] };
  }
  return null;
}

/* =========================================================
   РЕНДЕР
   ========================================================= */
let view = 'today';
let weekRef  = mondayOf(new Date());
let monthRef = new Date(new Date().getFullYear(), new Date().getMonth(), 1);
let selectedDay = null;

const PIN = '<svg viewBox="0 0 24 24"><path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';

function roomHtml(l){
  const online = isOnline(l.room);
  const link   = ONLINE_LINKS[l.subj];
  if (online){
    const label = `${PIN}<span>Онлайн</span>`;
    return link
      ? `<a class="lroom online" href="${link}" target="_blank" rel="noopener">${label}</a>`
      : `<span class="lroom online">${label}</span>`;
  }
  return `<span class="lroom">${PIN}${l.room}</span>`;
}

function lessonCard(l, date){
  const color = SUBJECT_COLORS[l.subj] || '#6366f1';
  const cls = lessonState(l, date);
  return `<article class="lesson ${cls}" style="--c:${color}">
    <div class="ltime"><b>${l.s}</b><span>${l.e}</span></div>
    <div class="lbody">
      <h3>${l.subj}</h3>
      <div class="ltype">${shortType(l.type)}</div>
      <div class="lmeta">
        <span class="lteacher">${l.teacher}</span>
        ${roomHtml(l)}
      </div>
    </div>
  </article>`;
}

/* Семестровое сообщение (каникулы / расписание ещё не опубликовано) */
function semesterEmptyHtml(date){
  if (isBeforeSem(date)){
    return `<div class="empty">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
      <div class="et">Расписание ещё не опубликовано</div>
      <div class="es">Загляните позже — скоро начнётся новый семестр.</div>
    </div>`;
  }
  return `<div class="empty">
    <svg viewBox="0 0 24 24"><path d="M12 3v4M12 3l-3 3M12 3l3 3"/><path d="M5 11h14l-1.2 7.2a2 2 0 0 1-2 1.8H8.2a2 2 0 0 1-2-1.8L5 11z"/><path d="M9 15h6"/></svg>
    <div class="et">Ура, каникулы! 🎄</div>
    <div class="es">С Новым годом! Расписание обновится с началом 8 семестра.</div>
  </div>`;
}

/* ---------- СЕГОДНЯ ---------- */
function renderToday(){
  const today = startOfDay(new Date());

  if (!isInSem(today)){
    return semesterEmptyHtml(today);
  }

  const list = lessonsFor(today);
  const wn   = weekNumber(today);

  let html = `<div class="page-head">
      <div class="ph-day">${DAY_FULL[today.getDay()]}</div>
      <div class="ph-date">${today.getDate()} ${MON_GEN[today.getMonth()]} ${today.getFullYear()}</div>
      <div class="week-pill">${wn} неделя</div>
    </div>`;

  if (list.length){
    html += `<div class="list">${list.map(l => lessonCard(l, today)).join('')}</div>`;
  } else {
    const nx = nextLesson();
    html += `<div class="empty">
      <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15h6"/></svg>
      <div class="et">Сегодня занятий нет</div>
      <div class="es">Отдыхаем — впереди ещё много пар</div>
      ${ nx ? `<div class="next-box">Ближайшее занятие:
          <b>${DAY_FULL[nx.d.getDay()]}, ${nx.d.getDate()} ${MON_GEN[nx.d.getMonth()]} · ${nx.l.s} — ${nx.l.subj}</b>
        </div>` : '' }
    </div>`;
  }
  return html;
}

/* ---------- НЕДЕЛЯ ---------- */
function renderWeek(){
  const mon = weekRef;
  const sun = addDays(mon, 6);

  /* Полностью вне семестра */
  if (isAfterSem(mon) || isBeforeSem(sun)){
    return `<div class="nav-row">
        <button class="nav-btn" data-nav="prev" ${isBeforeSem(mon) ? 'disabled' : ''} aria-label="Предыдущая неделя">‹</button>
        <div class="nav-title">
          <div class="nt-main">${mon.getDate()} ${MON_GEN[mon.getMonth()]} – ${sun.getDate()} ${MON_GEN[sun.getMonth()]}</div>
          <div class="nt-sub">вне семестра</div>
        </div>
        <button class="nav-btn" data-nav="next" ${isAfterSem(sun) ? 'disabled' : ''} aria-label="Следующая неделя">›</button>
      </div>` + semesterEmptyHtml(isAfterSem(mon) ? mon : sun);
  }

  const wn = weekNumber(mon);
  const range = (mon.getMonth() === sun.getMonth())
    ? `${mon.getDate()} – ${sun.getDate()} ${MON_GEN[sun.getMonth()]}`
    : `${mon.getDate()} ${MON_GEN[mon.getMonth()]} – ${sun.getDate()} ${MON_GEN[sun.getMonth()]}`;

  const prevDisabled = isBeforeSem(mon) || !isInSem(addDays(mon, -1));
  const nextDisabled = isAfterSem(sun)  || !isInSem(addDays(sun, 1));

  let html = `<div class="nav-row">
      <button class="nav-btn" data-nav="prev" ${prevDisabled ? 'disabled' : ''} aria-label="Предыдущая неделя">‹</button>
      <div class="nav-title">
        <div class="nt-main">${range}</div>
        <div class="nt-sub">${wn} неделя</div>
      </div>
      <button class="nav-btn" data-nav="next" ${nextDisabled ? 'disabled' : ''} aria-label="Следующая неделя">›</button>
    </div>`;

  const todayKey = ymd(new Date());

  for (let i = 0; i < 7; i++){
    const d = addDays(mon, i);
    if (!isInSem(d)) continue;
    const ls = lessonsFor(d);
    if (i === 6 && !ls.length) continue;
    const isToday = ymd(d) === todayKey;

    html += `<section class="dayblock ${isToday ? 'is-today' : ''}">
      <div class="dayblock-head">
        <span class="dh-name">${DAY_FULL[d.getDay()]}</span>
        <span class="dh-date">${d.getDate()} ${MON_GEN[d.getMonth()]}</span>
      </div>`;

    if (ls.length){
      html += `<div class="list">${ls.map(l => lessonCard(l, d)).join('')}</div>`;
    } else {
      html += `<div class="no-lessons">Занятий нет</div>`;
    }
    html += `</section>`;
  }
  return html;
}

/* ---------- МЕСЯЦ ---------- */
function renderMonth(){
  const y = monthRef.getFullYear();
  const m = monthRef.getMonth();
  const first = new Date(y, m, 1);
  const last  = new Date(y, m + 1, 0);

  /* Месяц полностью вне семестра */
  if (isAfterSem(first) || isBeforeSem(last)){
    const prevDisabled = !isInSem(addDays(first, -1));
    const nextDisabled = !isInSem(addDays(last,  1));
    return `<div class="nav-row">
        <button class="nav-btn" data-nav="prev" ${prevDisabled ? 'disabled' : ''} aria-label="Предыдущий месяц">‹</button>
        <div class="nav-title">
          <div class="nt-main">${MON_NOM[m]} ${y}</div>
          <div class="nt-sub">вне семестра</div>
        </div>
        <button class="nav-btn" data-nav="next" ${nextDisabled ? 'disabled' : ''} aria-label="Следующий месяц">›</button>
      </div>` + semesterEmptyHtml(isAfterSem(first) ? first : last);
  }

  const gridStart = mondayOf(first);
  const todayKey = ymd(new Date());

  if (!selectedDay || !isInSem(new Date(selectedDay + 'T00:00:00'))){
    const t = new Date();
    selectedDay = (t.getFullYear() === y && t.getMonth() === m && isInSem(t))
      ? ymd(t)
      : ymd(first);
  }

  const prevDisabled = !isInSem(addDays(first, -1));
  const nextDisabled = !isInSem(addDays(last,  1));

  let html = `<div class="nav-row">
      <button class="nav-btn" data-nav="prev" ${prevDisabled ? 'disabled' : ''} aria-label="Предыдущий месяц">‹</button>
      <div class="nav-title">
        <div class="nt-main">${MON_NOM[m]} ${y}</div>
        <div class="nt-sub">выберите день</div>
      </div>
      <button class="nav-btn" data-nav="next" ${nextDisabled ? 'disabled' : ''} aria-label="Следующий месяц">›</button>
    </div>`;

  html += `<div class="cal">
    <div class="cal-head">${[1,2,3,4,5,6,0].map(i => `<span>${DAY_SHORT[i]}</span>`).join('')}</div>
    <div class="cal-grid">`;

  const today = startOfDay(new Date());

  for (let i = 0; i < 42; i++){
    const d  = addDays(gridStart, i);
    const out = d.getMonth() !== m;
    const inSem = isInSem(d);
    const ls = inSem ? lessonsFor(d) : [];
    const isToday = ymd(d) === todayKey;
    const isSel = ymd(d) === selectedDay;
    const isPast = inSem && startOfDay(d) < today;
    const dots = ls.slice(0,3).map(l =>
      `<i style="background:${SUBJECT_COLORS[l.subj] || '#6366f1'}"></i>`).join('');

    const classes = ['mcell'];
    if (out) classes.push('out');
    if (!inSem) classes.push('disabled');
    if (isToday) classes.push('today');
    if (isSel) classes.push('sel');
    if (isPast && !isToday && !isSel) classes.push('past');

    html += `<button class="${classes.join(' ')}" ${inSem ? `data-date="${ymd(d)}"` : 'disabled'}>
        <span class="mnum">${d.getDate()}</span>
        <span class="dots">${dots}</span>
      </button>`;
  }
  html += `</div></div>`;

  const sd = new Date(selectedDay + 'T00:00:00');
  const sdLessons = lessonsFor(sd);
  html += `<div class="sel-title">${DAY_FULL[sd.getDay()]}, ${sd.getDate()} ${MON_GEN[sd.getMonth()]}</div>`;
  if (sdLessons.length){
    html += `<div class="list">${sdLessons.map(l => lessonCard(l, sd)).join('')}</div>`;
  } else {
    html += `<div class="empty" style="padding:20px">
        <div class="et" style="font-size:14px">Занятий нет</div>
      </div>`;
  }
  return html;
}

/* ---------- ОБЩИЙ РЕНДЕР ---------- */
function render(scrollTop){
  const app = document.getElementById('app');
  if (view === 'today')      app.innerHTML = renderToday();
  else if (view === 'week')  app.innerHTML = renderWeek();
  else                       app.innerHTML = renderMonth();

  document.querySelectorAll('.tabbar button').forEach(b => {
    b.classList.toggle('active', b.dataset.view === view);
  });
  if (scrollTop) window.scrollTo(0, 0);
}

/* =========================================================
   СОБЫТИЯ
   ========================================================= */
document.querySelector('.tabbar').addEventListener('click', e => {
  const btn = e.target.closest('button[data-view]');
  if (!btn) return;
  if (view === btn.dataset.view) { window.scrollTo({top:0, behavior:'smooth'}); return; }
  view = btn.dataset.view;
  if (view === 'week')  weekRef  = mondayOf(new Date());
  if (view === 'month') { monthRef = new Date(new Date().getFullYear(), new Date().getMonth(), 1); selectedDay = null; }
  render(true);
});

document.getElementById('app').addEventListener('click', e => {
  const cell = e.target.closest('.mcell');
  if (cell && cell.dataset.date){
    selectedDay = cell.dataset.date;
    render(false);
    return;
  }
  const nav = e.target.closest('[data-nav]');
  if (nav && !nav.disabled){
    const dir = nav.dataset.nav === 'next' ? 1 : -1;
    if (view === 'week'){
      const candidate = addDays(weekRef, 7 * dir);
      /* не уходим за пределы семестра */
      const candSun = addDays(candidate, 6);
      if (dir < 0 && isBeforeSem(candSun) && !isInSem(candidate)) return;
      if (dir > 0 && isAfterSem(candidate) && !isInSem(candSun)) return;
      weekRef = candidate;
    } else if (view === 'month'){
      const candidate = new Date(monthRef.getFullYear(), monthRef.getMonth() + dir, 1);
      const candLast  = new Date(candidate.getFullYear(), candidate.getMonth() + 1, 0);
      if (dir < 0 && isBeforeSem(candLast) && !isInSem(candidate)) return;
      if (dir > 0 && isAfterSem(candidate) && !isInSem(candLast)) return;
      monthRef = candidate;
      selectedDay = null;
    }
    render(true);
  }
});

/* Автообновление подсветки «сейчас» каждую минуту */
setInterval(() => { if (view === 'today') render(false); }, 60000);

/* =========================================================
   PWA: ИКОНКА И МАНИФЕСТ
   ========================================================= */
function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}

function makeIcon(size){
  const c = document.createElement('canvas');
  c.width = c.height = size;
  const x = c.getContext('2d');

  const g = x.createLinearGradient(0, 0, size, size);
  g.addColorStop(0, '#6366f1');
  g.addColorStop(1, '#8b5cf6');
  x.fillStyle = g;
  x.fillRect(0, 0, size, size);

  const pad = size * 0.22;
  const w = size - pad * 2;
  const h = size - pad * 2;
  const r = size * 0.085;

  x.save();
  roundRect(x, pad, pad, w, h, r);
  x.fillStyle = 'rgba(255,255,255,0.96)';
  x.fill();
  x.clip();

  x.fillStyle = '#4f46e5';
  x.fillRect(pad, pad, w, h * 0.2);

  const lx = pad + w * 0.14;
  const lw = w * 0.72;
  const lh = h * 0.1;

  x.fillStyle = '#818cf8';
  x.fillRect(lx, pad + h * 0.36, lw, lh);
  x.fillStyle = '#c7cbe8';
  x.fillRect(lx, pad + h * 0.55, lw * 0.74, lh);
  x.fillRect(lx, pad + h * 0.74, lw * 0.86, lh);
  x.restore();

  return c.toDataURL('image/png');
}

(function initPWA(){
  try{
    const icon512 = makeIcon(512);
    const icon180 = makeIcon(180);

    document.getElementById('apple-icon').href = icon180;

    const manifest = {

      display: 'standalone',
      orientation: 'portrait',

        { src: icon512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }
      ]
    };

    const blob = new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' });
    document.getElementById('manifest-link').href = URL.createObjectURL(blob);
